name: publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "release type"
        default: release
        required: true
        type: choice
        options:
          - alpha
          - beta
          - release
      changelog:
        description: "change log"
        required: true
        type: string
      maven-repository:
        description: "maven repository"
        required: true
        type: boolean
        default: true
      github-release:
        description: "publish github release"
        type: boolean
        default: true
      modrinth:
        description: "publish modrinth"
        type: boolean
        default: true
      curseforge:
        description: "publish curseforge"
        type: boolean
        default: true

jobs:
  call-build-workflow:
    permissions:
      contents: read
    uses: "./.github/workflows/build.yml"

  upload-maven:
    needs: call-build-workflow
    runs-on: ubuntu-latest
    if: inputs.maven-repository
    env:
      MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Download shimmer artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Shimmer
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Grant execute permission for gradle
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish to Maven
        run: ./gradlew publish

  publish:
    needs: call-build-workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        website: [ modrinth, curseforge, github_release ]
    name: ${{ matrix.website }}

    steps:
      - name: Download shimmer artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Shimmer

      - name: Checking and setting the environment
        id: shimmer_env
        continue-on-error: true
        run: |
          export name=$(ls build/libs/ | grep -v sources | grep -v dev | awk -F.jar '{print $1}' | head -n1)
          export mc_version="${{ github.event.inputs.release-type }}"
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Publish Github Release
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        if: matrix.website == 'github_release' && inputs.github-release
        with:
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadocs).jar
          name: ${{ steps.shimmer_env.outputs.name }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java: Java 25

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true

      - name: Publish Modrinth Release
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        if: matrix.website == 'modrinth' && inputs.modrinth
        with:
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadocs).jar
          name: ${{ steps.shimmer_env.outputs.name }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java: Java 25

          modrinth-id: uBKACKpl
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish Curseforge Release
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        if: matrix.website == 'curseforge' && inputs.curseforge
        with:
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadocs).jar
          name: ${{ steps.shimmer_env.outputs.name }}
          version-type: ${{ inputs.release-type }}
          changelog: ${{ inputs.changelog }}
          java: Java 25

          curseforge-id: 627824
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
